 <!DOCTYPE html>
 <html lang="fr" id="htmlRoot" dir="ltr">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>PostCraft Omni - Générateur de Contenu IA Multicanal</title>

     <!-- Tailwind CSS -->
     <script src="https://cdn.tailwindcss.com"></script>

     <!-- Police Inter -->
     <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
 rel="stylesheet">

     <!-- Icônes Lucide -->
     <script src="https://unpkg.com/lucide@latest"></script>

     <style>
         body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }

         .linkedin-shadow { box-shadow: 0 0 0 1px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.04); }

         @keyframes pulse-border {
             0%, 100% { border-color: rgba(225, 29, 72, 0.4); }
             50% { border-color: rgba(225, 29, 72, 1); }
         }
         .recording-active { animation: pulse-border 1.5s infinite; }

         ::-webkit-scrollbar { width: 6px; height: 6px; }
         ::-webkit-scrollbar-track { background: #f1f5f9; }
         ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }

         /* Spinner de chargement */
         .spinner {
             border: 3px solid rgba(255,255,255,.3);
             border-radius: 50%;
             border-top: 3px solid #ffffff;
             width: 16px;
             height: 16px;
             animation: spin 1s linear infinite;
         }
         @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
     </style>
 </head>
 <body class="text-slate-800 antialiased min-h-screen flex flex-col">

     <!-- EN-TÊTE (NAVIGATION) -->
     <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
         <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
